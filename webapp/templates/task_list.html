<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>
    <h1>Task List</h1>
    {% for task in tasks %}
        <div>
            <p>{{task.description}}</p>
            <p>{{task.status}}</p>
            <p>{{task.date}}</p>
        </div>
    {% endfor %}
    <a href="#">Add Task</a>
</body>
</html>
